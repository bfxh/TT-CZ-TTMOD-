name: cd

# CI（gates.yml）管「能不能合」；CD 管「能不能用」。
#
# ⚠️ 一条必须先说清的硬约束：**真实数据不在仓库里**。
#   · models/          2.5 GB  三款游戏导出的原始模型（版权归各厂商，不入仓）
#   · catalog_v3.json   13 MB  扫描 models/ 得到的目录
#   · _thumbs/         153 MB  build_thumbs.py 渲染的缩略图
#   所以 CI 里根本没有可发布的内容。这个工作流**不会**去合成一份假目录来把流程跑通 ——
#   那只会发布一个看起来能用、实际全是编造内容的站点。没有真实数据时明确跳过并说明。
#
# 一旦真实数据入仓（例如只入 catalog_v3.json + _thumbs/，让线上能浏览真实条目与真实缩略图），
# 下面的 job 会自动开始工作，不需要再改工作流。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  publish:
    name: 发布真实目录（数据不在仓时跳过）
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 探测仓库里有没有真实目录数据
        id: probe
        run: |
          set -euo pipefail
          if [ ! -f catalog_v3.json ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=仓库不含真实数据，CD 跳过发布::models/ 2.5 GB、catalog_v3.json、_thumbs/ 都不入仓，CI 里没有可发布的内容。本地使用：python build_catalog_v3.py && python build_thumbs.py && python tools/build_standalone.py，然后双击 index.html（或 start_vault.bat 起服务）。"
            exit 0
          fi
          items=$(python -c "import json;print(len(json.load(open('catalog_v3.json'))['items']))")
          thumbs=$(find _thumbs -name '*.webp' 2>/dev/null | wc -l)
          echo "目录 ${items} 条 · 缩略图 ${thumbs} 张"
          echo "ready=true" >> "${GITHUB_OUTPUT}"
          echo "items=${items}" >> "${GITHUB_OUTPUT}"
          echo "thumbs=${thumbs}" >> "${GITHUB_OUTPUT}"

      - name: 组装站点（真实目录 + 真实缩略图）
        if: steps.probe.outputs.ready == 'true'
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site/_res
          python -X utf8 tools/build_standalone.py --form js
          cp index.html _site/index.html
          cp _res/icons.js _res/three.min.js _res/OBJLoader.js _res/OrbitControls.js _res/catalog.js _site/_res/
          [ -d _thumbs ] && cp -r _thumbs _site/_thumbs || true
          [ -f catalog_v3.json ] && cp catalog_v3.json _site/ || true
          [ -f LICENSE ] && cp LICENSE _site/ || true
          ls -la _site | head

      - name: 产物自检
        if: steps.probe.outputs.ready == 'true'
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/_res/catalog.js
          test -s _site/_res/icons.js
          grep -q 'window.CATALOG' _site/_res/catalog.js || { echo "× 目录数据没写进去"; exit 1; }
          n=$(find _site/_thumbs -name '*.webp' 2>/dev/null | wc -l)
          echo "站点缩略图 ${n} 张 · 整站 $(du -sh _site | cut -f1)"
          test "$n" -gt 0 || { echo "× 没有缩略图，线上会是一屏「无缩略图」"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        if: steps.probe.outputs.ready == 'true'
        with:
          path: _site

      - name: 探测 Pages 是否已启用
        # 没开 Pages 时 GITHUB_TOKEN 没有建站权限（Resource not accessible by integration），
        # configure-pages 会把 job 直接打红 —— 但那是**仓库设置**没做，不是代码坏了。
        if: steps.probe.outputs.ready == 'true'
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "on=true" >> "${GITHUB_OUTPUT}"
          else
            echo "on=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=GitHub Pages 未启用，已跳过部署::启用一次即可（之后自动）：gh api -X POST repos/${GITHUB_REPOSITORY}/pages -f build_type=workflow"
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.on == 'true'
      - id: deploy
        if: steps.pages.outputs.on == 'true'
        uses: actions/deploy-pages@v4

      - name: 打 tag 时附到 Release
        if: steps.probe.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python -X utf8 tools/build_standalone.py --form single --out "dist/资产库.html"
          cp "dist/资产库.html" "dist/资产库-$TAG.html"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "资产库 $TAG" --generate-notes
          gh release upload "$TAG" "dist/资产库-$TAG.html" --repo "$GITHUB_REPOSITORY" --clobber
          echo "已发布：https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "（单文件不含缩略图；完整效果请在仓库根目录双击 index.html）"
